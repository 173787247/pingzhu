[Addon]
Name=PingZhu
Category=InputMethod
Version=0.9.0
Library=libpingzhu
Type=SharedLibrary
# Loaded at startup, not on demand.
#
# OnDemand=True is what fcitx5's own input methods use, but those are built in
# and always known. This addon is a plugin: with OnDemand=True, fcitx5 checked
# the profile before the addon was loaded, did not recognise `pingzhu` as an
# input method, and removed it from the group —
#
#   Group Item pingzhu in group Default is not valid. Removed.
#
# The message says the input method was removed and leaves out both the reason
# and the fix. The addon is small and a user who installed it wants it, so it
# loads with fcitx5.
OnDemand=False
Configurable=False
