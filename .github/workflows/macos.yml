name: macOS

# The macOS shell is built here because it has to be.
#
# Nobody developing this project needs a Mac to work on the engine, the Windows
# shells or the Android shell — but Swift against InputMethodKit does, and the
# alternative is code that has never been compiled. A macOS runner is free for
# public repositories, so "it builds" can be a fact rather than an intention.
#
# It cannot test typing: that needs a person and a Mac. It can and does test the
# routing rules, which are the part this project has already got wrong once.

on:
  push:
    branches: [main]
    paths: ['macos/**', 'core-rs/**', 'tools/routing-vectors.tsv', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', 'core-rs/**', 'tools/routing-vectors.tsv']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          swift --version
          uname -m

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core-rs/target
          key: macos-cargo-${{ hashFiles('core-rs/**/*.rs', 'core-rs/Cargo.toml') }}

      - name: Build the bundle, exercise the engine, run the routing vectors
        run: bash macos/build.sh

      - name: Check the bundle is what the system expects
        run: |
          set -e
          APP=dist/PingZhu.app
          test -x "$APP/Contents/MacOS/PingZhu"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/data/bopomofo-lm.tsv"

          # An input method with the wrong package type installs into
          # ~/Library/Input Methods and then never appears in the list.
          plutil -extract CFBundlePackageType raw "$APP/Contents/Info.plist" | grep -qx APPL

          # The connection name has to match main.swift exactly, or the server
          # starts and the system never finds it. Nothing reports this at
          # run time — the input method simply does nothing.
          NAME=$(plutil -extract InputMethodConnectionName raw "$APP/Contents/Info.plist")
          grep -q "\"$NAME\"" macos/Sources/main.swift

          CLASS=$(plutil -extract InputMethodServerControllerClass raw "$APP/Contents/Info.plist")
          grep -q "@objc($CLASS)" macos/Sources/PingZhuInputController.swift

          # The declared input mode must be in the list, IN THE RIGHT PLACE.
          #
          # The first version of this check looked for `tsInputModeListKey` at the
          # top level and passed — while the key was in the wrong place and the
          # system ignored the whole bundle. "Does the key exist" is not the
          # question; "is the structure right" is.
          plutil -extract ComponentInputModeDict.tsInputModeListKey raw \
            "$APP/Contents/Info.plist" >/dev/null
          plutil -extract ComponentInputModeDict.tsVisibleInputModeOrderedArrayKey raw \
            "$APP/Contents/Info.plist" >/dev/null

          # And the mode has to declare the right script, or it is filed under
          # Roman and never offered while typing Chinese.
          MODE=$(plutil -extract ComponentInputModeDict.tsVisibleInputModeOrderedArrayKey.0 raw \
            "$APP/Contents/Info.plist")
          SCRIPT=$(plutil -extract "ComponentInputModeDict.tsInputModeListKey.$MODE.tsInputModeScriptKey" raw \
            "$APP/Contents/Info.plist")
          echo "input mode: $MODE (script $SCRIPT)"
          test "$SCRIPT" = "smTradChinese"

          # The input source identifier IMK reports must match what the install
          # test looks for, or it reports a false failure.
          TISID=$(plutil -extract TISInputSourceID raw "$APP/Contents/Info.plist")
          test "$TISID" = "tw.pingzhu.ime"

          # Both architectures, in the executable as well as the library.
          #
          # The Rust archive was universal while the Swift binary was built only
          # for the runner's architecture — so the bundle would install on an
          # Intel Mac, appear in the input source list, and then not launch. The
          # first build did exactly that and nothing complained.
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/PingZhu")
          echo "executable architectures: $ARCHS"
          case "$ARCHS" in
            *arm64*) ;;
            *) echo "::error::the executable is missing arm64" && exit 1 ;;
          esac
          case "$ARCHS" in
            *x86_64*) ;;
            *) echo "::error::the executable is missing x86_64 — Intel Macs would install it and it would not launch" && exit 1 ;;
          esac

          # And the same for the linked-in core.
          lipo -archs core-rs/target/libpingzhu_core_universal.a | grep -q x86_64

          echo "bundle checks passed"

      # Answers, rather than asserts: how far can verification go on a runner?
      # A GUI session would mean the input method itself could be enabled and
      # typed into here; no GUI session means that stays a person's job.
      #
      # It runs even if the build failed, because the answer is worth having
      # either way — and it never fails the job, because "no GUI session" is a
      # finding, not a defect.
      - name: Probe what the runner can see
        if: always()
        run: |
          echo "session: $(launchctl managername || echo unknown)"
          echo "user: $(whoami)"
          echo "console owner: $(stat -f%Su /dev/console 2>/dev/null || echo unknown)"
          echo "---"
          if swiftc -O -framework Carbon -o dist/Probe macos/Tests/Probe/main.swift; then
            ./dist/Probe || true
          else
            echo "probe  the probe itself did not compile — reporting what the shell can see instead"
          fi

      # The part of the IMK layer that can be checked without a person: does the
      # bundle register itself as an input source at all?
      #
      # The runner has an Aqua session (see the probe), so this is a real
      # answer rather than a hopeful one. What it cannot check is typing.
      - name: Install it and ask the system whether it took
        run: |
          set -e
          swiftc -O -framework Carbon -framework Cocoa \
            -o dist/InstallTest macos/Tests/Install/main.swift
          ./dist/InstallTest "$PWD/dist/PingZhu.app"

      - name: Report the binary architectures
        run: |
          lipo -info core-rs/target/libpingzhu_core_universal.a
          file dist/PingZhu.app/Contents/MacOS/PingZhu

      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: PingZhu.app
          path: dist/PingZhu.app
          if-no-files-found: error
