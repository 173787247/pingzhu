name: macOS

# The macOS shell is built here because it has to be.
#
# Nobody developing this project needs a Mac to work on the engine, the Windows
# shells or the Android shell — but Swift against InputMethodKit does, and the
# alternative is code that has never been compiled. A macOS runner is free for
# public repositories, so "it builds" can be a fact rather than an intention.
#
# It cannot test typing: that needs a person and a Mac. It can and does test the
# routing rules, which are the part this project has already got wrong once.

on:
  push:
    branches: [main]
    paths: ['macos/**', 'core-rs/**', 'tools/routing-vectors.tsv', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', 'core-rs/**', 'tools/routing-vectors.tsv']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          swift --version
          uname -m

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core-rs/target
          key: macos-cargo-${{ hashFiles('core-rs/**/*.rs', 'core-rs/Cargo.toml') }}

      - name: Build the bundle, exercise the engine, run the routing vectors
        run: bash macos/build.sh

      - name: Check the bundle is what the system expects
        run: python3 tools/check-macos-bundle.py dist/PingZhu.app

      # Answers, rather than asserts: how far can verification go on a runner?
      # A GUI session would mean the input method itself could be enabled and
      # typed into here; no GUI session means that stays a person's job.
      #
      # It runs even if the build failed, because the answer is worth having
      # either way — and it never fails the job, because "no GUI session" is a
      # finding, not a defect.
      - name: Probe what the runner can see
        if: always()
        run: |
          echo "session: $(launchctl managername || echo unknown)"
          echo "user: $(whoami)"
          echo "console owner: $(stat -f%Su /dev/console 2>/dev/null || echo unknown)"
          echo "---"
          if swiftc -O -framework Carbon -o dist/Probe macos/Tests/Probe/main.swift; then
            ./dist/Probe || true
          else
            echo "probe  the probe itself did not compile — reporting what the shell can see instead"
          fi

      # The part of the IMK layer that can be checked without a person: does the
      # bundle register itself as an input source at all?
      #
      # The runner has an Aqua session (see the probe), so this is a real
      # answer rather than a hopeful one. What it cannot check is typing.
      - name: Install it and ask the system whether it took
        run: |
          set -e
          swiftc -O -framework Carbon -framework Cocoa \
            -o dist/InstallTest macos/Tests/Install/main.swift
          ./dist/InstallTest "$PWD/dist/PingZhu.app"

      - name: Report the binary architectures
        run: |
          lipo -info core-rs/target/libpingzhu_core_universal.a
          file dist/PingZhu.app/Contents/MacOS/PingZhu

      # Zipped before uploading, and with `ditto`.
      #
      # `upload-artifact` with a directory uploads its *contents*, so downloading
      # it back gives `Contents/...` with no `.app` around it — a bundle that
      # cannot be reconstructed. The first version did exactly that, and the
      # error only shows up on the way out:
      #
      #   error extracting "Contents/Info.plist": file exists
      #
      # `ditto -c -k --keepParent` is how macOS zips an application: it keeps the
      # bundle as the top-level entry and preserves the permissions and extended
      # attributes that a signed bundle depends on. `zip` does not.
      - name: Package the app bundle
        run: |
          set -e
          ditto -c -k --keepParent dist/PingZhu.app dist/PingZhu-0.9.0-macos.zip
          ditto -x -k dist/PingZhu-0.9.0-macos.zip /tmp/roundtrip
          test -x /tmp/roundtrip/PingZhu.app/Contents/MacOS/PingZhu
          codesign --verify /tmp/roundtrip/PingZhu.app
          echo "round-trip ok: unzipping gives back a runnable, signed bundle"

      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: PingZhu-0.9.0-macos.zip
          path: dist/PingZhu-0.9.0-macos.zip
          if-no-files-found: error
