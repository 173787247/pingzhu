name: HarmonyOS

# HarmonyOS has no runner of its own at GitHub, and the SDK is not something you
# can apt-get. What makes this possible is a container image with the whole
# toolchain already in it (ohpm, hvigorw, the ArkTS compiler, the NDK), which
# runs on an ordinary ubuntu runner.
#
# Two things to be honest about:
#
#   1. The image is third-party. It is not Huawei's. Using it means someone
#      else's image executes this repository's code, so it is pinned to an exact
#      version rather than a moving tag, and the build produces only a HAP —
#      nothing here is published, installed or trusted by anyone. The day there
#      is an official route, this comment should be replaced along with the image.
#
#   2. Building is not running. A HAP that compiles proves the ArkTS is
#      well-formed, the module declares what the framework expects, and the
#      engine links. It does not prove the keyboard types. That needs a HarmonyOS
#      device or emulator, and neither is available here.
#
# What this container turned out to be, learned one failure at a time: no
# python3, node not on PATH, no curl, no wget. It has the HarmonyOS toolchain and
# almost nothing else. Hence the shape below — the Rust half runs where ordinary
# tooling exists, and the .a travels between the two jobs as an artifact.
on:
  push:
    branches: [main]
    paths:
      - 'harmonyos/**'
      - 'core-rs/**'
      - '.github/workflows/harmonyos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The engine first, on a plain runner.
  #
  # Cross-compiling the core has nothing to do with HarmonyOS's build system, and
  # running it here rather than in the container means a failure in this job is
  # about the Rust code — not about an image that is missing curl.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos

      - name: Get the OHOS NDK
        shell: bash
        run: |
          set -e
          # rustc has a built-in target for HarmonyOS, but the linker and the
          # sysroot come from the SDK. Taking it out of the same image the build
          # job uses means both halves agree on which SDK this is.
          docker create --name sdk \
            ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:v5.0.4 >/dev/null
          docker cp sdk:/opt/harmonyos-tools/command-line-tools/sdk/default/openharmony/native ./ohos-native
          docker rm sdk >/dev/null
          echo "--- native ---"
          ls ohos-native | head
          echo "--- linkers ---"
          ls ohos-native/llvm/bin 2>/dev/null | grep -i "ohos-clang" | head -5

      - name: Cross-compile the core
        shell: bash
        run: |
          set -e
          rustc --version
          NDK="$PWD/ohos-native"
          LINKER="$NDK/llvm/bin/aarch64-unknown-linux-ohos-clang"
          if [ ! -x "$LINKER" ]; then
            echo "::error::linker not found: $LINKER"
            echo "--- what the NDK does have ---"
            ls "$NDK/llvm/bin" 2>/dev/null | head -30
            exit 1
          fi
          echo "linker: $LINKER"

          env \
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_OHOS_LINKER="$LINKER" \
            CC_aarch64_unknown_linux_ohos="$LINKER" \
            AR_aarch64_unknown_linux_ohos="$NDK/llvm/bin/llvm-ar" \
            cargo build --release --manifest-path core-rs/Cargo.toml \
              --target aarch64-unknown-linux-ohos

          echo "--- what was produced ---"
          ls -la core-rs/target/aarch64-unknown-linux-ohos/release/libpingzhu_core.a
          file core-rs/target/aarch64-unknown-linux-ohos/release/libpingzhu_core.a

      # The engine's own tests, run where they can run.
      - name: Test the core on the host
        run: cargo test --manifest-path core-rs/Cargo.toml --release

      - name: Hand the static library to the build job
        uses: actions/upload-artifact@v4
        with:
          name: libpingzhu-core-ohos
          path: core-rs/target/aarch64-unknown-linux-ohos/release/libpingzhu_core.a
          if-no-files-found: error

  # Then the HAPs, where the SDK is.
  build:
    needs: engine
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:v5.0.4
      options: --user root

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Take the engine
        uses: actions/download-artifact@v4
        with:
          name: libpingzhu-core-ohos
          path: core-rs/target/aarch64-unknown-linux-ohos/release

      - name: Show what we have
        shell: bash
        run: |
          echo "--- engine ---"
          ls -la core-rs/target/aarch64-unknown-linux-ohos/release/ || echo "(missing)"
          echo "--- toolchain ---"
          ls /opt
          echo "--- sdk native ---"
          find /opt -type d -path '*openharmony/native' 2>/dev/null | head -2

      - name: Check the project is well-formed
        shell: bash
        run: node --version || echo "NOTE  no node on PATH in this container"

      # What the SDK actually exports, asked of the SDK itself.
      #
      # The first build failed with "Cannot find module
      # '@ohos.inputMethod.InputMethodExtensionAbility'" — the imports most
      # examples still use do not exist in an API 12 SDK, which moved to
      # Kit-style imports. Rather than guess a second time, print what is there.
      - name: Ask the SDK what the IME API is called
        if: always()
        shell: bash
        run: |
          set +e
          KIT=$(find /opt -name '@kit.IMEKit.d.ts' 2>/dev/null | head -1)
          echo "--- @kit.IMEKit ---"
          echo "path: ${KIT:-(not found)}"
          [ -n "$KIT" ] && grep -E "^export" "$KIT" | head -20
          echo
          echo "--- inputMethodEngine: the API that reaches the editor ---"
          IME=$(find /opt -name '@ohos.inputMethodEngine.d.ts' 2>/dev/null | head -1)
          echo "path: ${IME:-(not found)}"
          if [ -n "$IME" ]; then
            echo "--- exported names ---"
            grep -E "^export|^declare" "$IME" | head -30
            echo "--- InputClient (what insertText lives on) ---"
            sed -n '/interface InputClient/,/^  }/p' "$IME" | grep -E "^\s+(insertText|delete|getForward|moveCursor|sendKeyFunction|getEditorAttribute|on|off)" | head -20
            echo "--- InputMethodAbility events ---"
            grep -E "on\(type: '(inputStart|inputStop|keyboardShow|keyboardHide)'" "$IME" | head -10
          fi
          echo
          echo "--- native toolchain ---"
          find /opt -name 'ohos.toolchain.cmake' 2>/dev/null | head -3
          echo
          echo "--- @kit.PerformanceAnalysisKit ---"
          PAA=$(find /opt -name '@kit.PerformanceAnalysisKit.d.ts' 2>/dev/null | head -1)
          [ -n "$PAA" ] && grep -E "^export" "$PAA" | head -10
          exit 0

      # The language model, into the HAP.
      #
      # The native side cannot read inside a HAP, so the extension unpacks these
      # to the app's files directory on first use and passes that path to
      # engine_create. Android does the same thing with an assets copy task.
      #
      # Done here rather than committed: the .tsv files are the same ones the
      # other three platforms use, and a copy in the repository would be a second
      # version of them.
      - name: Put the language model in the HAP
        shell: bash
        run: |
          set -e
          DEST=harmonyos/keyboard/src/main/resources/rawfile
          mkdir -p "$DEST"
          cp data/*.tsv "$DEST/"
          echo "--- rawfile ---"
          ls -la "$DEST"

      - name: Install dependencies
        shell: bash
        run: |
          cd harmonyos
          ohpm install --all 2>&1 | tail -20 || true

      - name: Build the HAPs
        shell: bash
        run: |
          cd harmonyos
          set +e
          # Asking for bash explicitly: the container's default shell is `sh` —
          # dash — and ${PIPESTATUS[0]} is a bash-ism. The first version died with
          # "Bad substitution" *after* hvigor had printed BUILD SUCCESSFUL, which
          # is a confusing way to learn the shell is not the one you assumed.
          hvigorw clean --no-daemon > /tmp/clean.log 2>&1
          echo "clean exit: $?"
          tail -3 /tmp/clean.log

          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon > /tmp/build.log 2>&1
          STATUS=$?
          echo "--- last 60 lines ---"
          tail -60 /tmp/build.log
          echo "hvigorw assembleHap exit: $STATUS"
          exit $STATUS

      - name: Report what was produced
        if: always()
        shell: bash
        run: |
          echo "--- HAPs ---"
          find harmonyos -name '*.hap' 2>/dev/null | while read -r f; do
            echo "  $f  ($(du -h "$f" | cut -f1))"
          done
          echo "--- is the engine inside? ---"
          HAP=$(find harmonyos -name 'keyboard-*.hap' 2>/dev/null | head -1)
          if [ -n "$HAP" ]; then
            # The whole point of the exercise: the HAP must carry the compiled
            # engine, not a stub. Checking the file list rather than trusting a
            # size is the difference between "it built" and "it built the thing".
            unzip -l "$HAP" 2>/dev/null | grep -E "\.so$" || echo "  (no .so in the HAP)"
          else
            echo "  no keyboard HAP was produced"
          fi

      - name: Upload the HAPs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pingzhu-harmonyos-hap
          path: harmonyos/**/*.hap
          if-no-files-found: warn
