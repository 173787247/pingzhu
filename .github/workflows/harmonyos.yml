name: HarmonyOS

# HarmonyOS has no runner of its own at GitHub, and the SDK is not something you
# can apt-get. What makes this possible is a container image with the whole
# toolchain already in it (ohpm, hvigorw, the ArkTS compiler), which runs on an
# ordinary ubuntu runner.
#
# Two things to be honest about:
#
#   1. The image is third-party. It is not Huawei's. Using it means someone
#      else's image executes this repository's code, so it is pinned to an exact
#      version rather than a moving tag, and the build produces only a HAP —
#      nothing here is published, installed or trusted by anyone. The day there
#      is an official route, this comment should be replaced along with the image.
#
#   2. Building is not running. A HAP that compiles proves the ArkTS is
#      well-formed and the module declares what the framework expects. It does
#      not prove the keyboard types. That needs a HarmonyOS device or emulator,
#      and neither is available here.
on:
  push:
    branches: [main]
    paths:
      - 'harmonyos/**'
      - '.github/workflows/harmonyos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sanchuanhehe/harmony-next-pipeline-docker/harmonyos-ci-image:v5.0.4
      options: --user root

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          echo "--- versions ---"
          which ohpm hvigorw node 2>&1 || true
          node --version 2>&1 || true
          ohpm --version 2>&1 || true
          echo "--- sdk ---"
          ls "${OHOS_SDK_HOME:-/opt/ohos-sdk}" 2>/dev/null || \
            ls /opt 2>/dev/null | head -20 || true

      - name: Check the project is well-formed
        run: |
          set -e
          echo "--- module declarations ---"
          # Node, not Python: this container carries the HarmonyOS toolchain and
          # not much else. The first version of this step used python3 and died
          # with "python3: not found" — while the toolchain it was checking for
          # was sitting right there in /opt.
          #
          # The check itself is worth having: hvigor's own errors for a missing
          # hvigorfile.ts or a module name that disagrees with module.json5 name
          # the wrong file, which sends you looking in the wrong place.
          cat > /tmp/check.mjs <<'JS'
          import { readFileSync, existsSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';

          // These files are json5 but only use one json5 feature — trailing
          // commas — so stripping them is enough to parse with JSON.parse.
          const parse = (path) =>
            JSON.parse(readFileSync(path, 'utf8').replace(/,(\s*[}\]])/g, '$1'));

          const root = 'harmonyos';
          const profile = parse(join(root, 'build-profile.json5'));
          const failures = [];

          for (const module of profile.modules) {
            const name = module.name;
            const src = join(root, module.srcPath.replace(/^\.\//, ''));
            for (const required of ['build-profile.json5', 'hvigorfile.ts', 'oh-package.json5']) {
              if (!existsSync(join(src, required))) failures.push(`${name}: missing ${required}`);
            }
            const manifestPath = join(src, 'src/main/module.json5');
            if (!existsSync(manifestPath)) {
              failures.push(`${name}: missing src/main/module.json5`);
              continue;
            }
            const declared = parse(manifestPath).module;
            if (declared.name !== name) {
              failures.push(`${name}: module.json5 says '${declared.name}' instead`);
            }
            if (!['entry', 'feature', 'shared'].includes(declared.type)) {
              failures.push(`${name}: unknown module type '${declared.type}'`);
            }
            console.log(`  ${name}: type=${declared.type} mainElement=${declared.mainElement ?? '-'}`);
          }

          // The input method module has to point srcEntry at a real file that
          // actually extends the right class, or the HAP installs and the system
          // never offers the keyboard.
          const imeManifest = parse(join(root, 'keyboard/src/main/module.json5')).module;
          const srcEntry = imeManifest.srcEntry.replace(/^\.\//, '');
          const imeFile = join(root, 'keyboard/src/main', srcEntry);
          if (!existsSync(imeFile)) {
            failures.push(`keyboard: srcEntry points at ${imeFile}, which does not exist`);
          } else {
            const source = readFileSync(imeFile, 'utf8');
            if (!source.includes('InputMethodExtensionAbility')) {
              failures.push(`${imeFile} does not extend InputMethodExtensionAbility`);
            }
            console.log(`  keyboard srcEntry -> ${imeFile}`);
          }

          // Every resource the manifests reference must exist. A missing icon is
          // a build failure; a missing string is a blank label at runtime.
          const referenced = [];
          for (const [, kind, name] of readFileSync(join(root, 'AppScope/app.json5'), 'utf8')
                 .matchAll(/\$(media|string):([A-Za-z0-9_]+)/g)) {
            referenced.push({ kind, name, where: 'AppScope' });
          }
          for (const module of profile.modules) {
            const manifestPath = join(root, module.srcPath.replace(/^\.\//, ''), 'src/main/module.json5');
            if (!existsSync(manifestPath)) continue;
            for (const [, kind, name] of readFileSync(manifestPath, 'utf8')
                   .matchAll(/\$(media|string):([A-Za-z0-9_]+)/g)) {
              referenced.push({ kind, name, where: module.name });
            }
          }
          for (const ref of referenced) {
            const scope = ref.where === 'AppScope' ? 'AppScope/resources/base' : `${ref.where}/src/main/resources/base`;
            if (ref.kind === 'media') {
              const dir = join(root, scope, 'media');
              const found = existsSync(dir) && readdirSync(dir).some((f) => f.startsWith(ref.name + '.'));
              if (!found) failures.push(`${ref.where}: $media:${ref.name} has no file in ${dir}`);
            } else {
              const file = join(root, scope, 'element/string.json');
              const has = existsSync(file) && JSON.parse(readFileSync(file, 'utf8'))
                .string.some((entry) => entry.name === ref.name);
              if (!has) failures.push(`${ref.where}: $string:${ref.name} is not defined in ${file}`);
            }
          }
          console.log(`  ${referenced.length} resource references resolved`);

          if (failures.length) {
            for (const failure of failures) console.log(`FAIL  ${failure}`);
            process.exit(1);
          }
          console.log(`${profile.modules.length} modules declared correctly`);
          JS
          node /tmp/check.mjs

      - name: Install dependencies
        run: |
          cd harmonyos
          ohpm install --all 2>&1 | tail -20 || true

      - name: Build the HAPs
        run: |
          cd harmonyos
          set +e
          hvigorw clean --no-daemon 2>&1 | tail -5
          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon 2>&1 | tail -80
          STATUS=${PIPESTATUS[0]}
          echo "hvigorw exit: $STATUS"
          exit $STATUS

      - name: Report what was produced
        if: always()
        run: |
          echo "--- HAPs ---"
          find harmonyos -name '*.hap' -o -name '*.app' 2>/dev/null | while read -r f; do
            echo "  $f  ($(du -h "$f" | cut -f1))"
          done
          FOUND=$(find harmonyos -name '*.hap' 2>/dev/null | wc -l)
          echo "  $FOUND HAP file(s)"
          if [ "$FOUND" -eq 0 ]; then
            echo "::warning::no HAP was produced — read the build log above"
          fi

      - name: Upload the HAPs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pingzhu-harmonyos-hap
          path: |
            harmonyos/**/*.hap
          if-no-files-found: warn
