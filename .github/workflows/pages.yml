name: Pages

# The browser demo, deployed.
#
# It is the only way to try the engine without installing anything, and it is
# the same code the test suite runs against — tools/build-demo.mjs strips the
# TypeScript syntax with Node's own parser rather than bundling a separate
# build, so the demo cannot drift from the engine.
#
# That claim is checked here rather than asserted: the workflow rebuilds the
# demo and fails if the result differs from what is committed. A demo running an
# older engine than the tests would be the most confusing kind of wrong.
on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'engine/src/**'
      - 'tools/build-demo.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the version that generated the committed demo.
          #
          # The demo is produced by Node's own TypeScript-stripping parser, not
          # by a bundler, and its output can change between Node releases. The
          # first run of this workflow used 22 while the committed files were
          # generated with 24 — and the check below correctly reported a
          # mismatch that was really a toolchain difference.
          node-version: '24'

      - name: The committed demo matches the engine it claims to run
        run: |
          set -e
          node tools/build-demo.mjs

          # git diff, not a copy and a recursive diff.
          #
          # The first two versions tried to snapshot demo/ into /tmp and compare.
          # `cp -r demo /tmp/x` copies demo *to* x when x does not exist and
          # *into* it when it does; `cp -r demo/. /tmp/x/` then silently produced
          # nothing on the runner. Both failures reported "No such file or
          # directory" for a directory the step had just created.
          #
          # The repository already knows what the committed files are. Asking it
          # is one line and cannot be wrong about cp semantics.
          if ! git diff --quiet -- demo/engine; then
            echo "::error::demo/engine is not what tools/build-demo.mjs produces"
            git diff --stat -- demo/engine
            exit 1
          fi
          echo "demo/engine is current"

      - name: The engine's own tests pass
        run: |
          cd engine
          npm install --no-audit --no-fund 2>&1 | tail -2
          node --test 2>&1 | tail -5

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
