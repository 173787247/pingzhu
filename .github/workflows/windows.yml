name: Windows

# The portable shell and the text service are the two halves of this project
# that no other workflow builds: Linux, macOS and HarmonyOS each have their own
# file, and the Windows one was missing. Everything under windows/ has therefore
# only ever been compiled on the machines of whoever was working on it — which
# is how a hard-coded path to one installation of Visual Studio survived in
# build.bat, and how a candidate window one line too short survived in
# candidate_window.cpp.
#
# The staging directory is built here rather than by windows/build.sh, because
# that script is deliberately a WSL script: it reads the Windows local app data
# path through /mnt and moves locked DLLs aside with tasklist.exe. A runner has
# no WSL, so the same files are put in one flat directory with PowerShell, and
# build.bat — which is ordinary cmd.exe — does the rest.
on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'core-rs/**'
      - 'data/**'
      - 'tools/routing-vectors.tsv'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'core-rs/**'
      - 'tools/routing-vectors.tsv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build the shared core
        run: |
          cargo build --release --manifest-path core-rs/Cargo.toml --target x86_64-pc-windows-msvc
          Get-Item core-rs\target\x86_64-pc-windows-msvc\release\pingzhu_core.dll | Format-List Length, FullName
        shell: pwsh

      - name: Stage what build.bat expects next to itself
        shell: pwsh
        run: |
          # build.bat links pingzhu_core.dll by name from its own directory, and
          # the engine reads its data from the directory it is handed.
          #
          # This mirrors windows/build.sh, file for file: that script is the
          # reference for what a staging directory contains, and the first
          # version of this step left out ts-conversion.tsv — the 繁/簡 table —
          # which the engine tolerates at run time (it simply cannot convert) but
          # the engine test does not.
          $stage = Join-Path $env:RUNNER_TEMP 'pingzhu-stage'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse windows\src $stage\src
          Copy-Item -Recurse windows\tests $stage\tests
          Copy-Item -Recurse windows\tsf $stage\tsf
          # MSVC's batch parser wants CRLF, and the file in the repository is
          # LF like everything else. build.sh does this conversion too.
          $bat = (Get-Content windows\build.bat -Raw) -replace "`r?`n", "`r`n"
          Set-Content -NoNewline -Path (Join-Path $stage 'build.bat') -Value $bat
          Copy-Item core-rs\target\x86_64-pc-windows-msvc\release\pingzhu_core.dll $stage
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'data') | Out-Null
          Copy-Item data\bopomofo-lm.tsv (Join-Path $stage 'data')
          Copy-Item data\ts-conversion.tsv (Join-Path $stage 'data')
          Get-ChildItem $stage, (Join-Path $stage 'data') | Format-Table Name, Length
          "PINGZHU_STAGE=$stage" | Out-File -Append $env:GITHUB_ENV

      - name: Build the shell and the text service
        working-directory: ${{ env.PINGZHU_STAGE }}
        run: |
          # This is also the test of the MSVC discovery in build.bat: it asks
          # vswhere first, then falls back to known installations, and the runner
          # is not the machine the first version of that path was written on.
          cmd /c build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem *.exe, *.dll | Format-Table Name, Length
        shell: pwsh

      - name: Routing rules, against the shared vectors
        working-directory: ${{ env.PINGZHU_STAGE }}
        run: |
          .\pingzhu-router-test.exe "${{ github.workspace }}\tools\routing-vectors.tsv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Engine, through the real DLL
        working-directory: ${{ env.PINGZHU_STAGE }}
        run: |
          .\pingzhu-engine-test.exe data
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: TSF COM contract
        # Run, but not a gate. The test creates the TSF thread manager and asks
        # it for the language-bar item manager — it checks its own COM contract
        # against the real runtime, which is what makes it worth running, and
        # also what a runner does not have: this passes on an ordinary desktop
        # ("all COM checks passed") and fails in a runner's session. The output
        # stays in the log; the build does not turn red over an environment the
        # job cannot provide.
        continue-on-error: true
        working-directory: ${{ env.PINGZHU_STAGE }}
        run: |
          .\pingzhu-tsf-test.exe
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::the TSF runtime is not available in this session"; exit 1 }
        shell: pwsh

      - name: Candidate window geometry
        working-directory: ${{ env.PINGZHU_STAGE }}
        run: |
          # Opens a real window, so it needs a desktop. A runner has one; a
          # headless build machine would not, which is why the packaging
          # self-check runs the engine and COM tests only.
          .\pingzhu-candidate-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: pingzhu-windows-portable
          path: |
            ${{ env.PINGZHU_STAGE }}/pingzhu-ime.exe
            ${{ env.PINGZHU_STAGE }}/pingzhu_core.dll
            ${{ env.PINGZHU_STAGE }}/pingzhu-tsf-*.dll
            ${{ env.PINGZHU_STAGE }}/pingzhu-regtool.exe
          if-no-files-found: error

      - name: Report
        if: always()
        run: |
          {
            echo "### Windows"
            echo ""
            echo "- built: portable shell, text service DLL, registration tool"
            echo "- routing: \`pingzhu-router-test.exe\` against \`tools/routing-vectors.tsv\`"
            echo "- engine: \`pingzhu-engine-test.exe\` through the real \`pingzhu_core.dll\`"
            echo "- candidate window: \`pingzhu-candidate-test.exe\` (opens the window and"
            echo "  checks its height covers the lines it draws)"
            echo "- TSF COM contract: runs, but is not a gate — it needs the TSF runtime,"
            echo "  which a runner's session does not have (it passes on a desktop)"
            echo "- **not covered**: installing the text service into the language bar,"
            echo "  and typing into a real application — both need an interactive desktop"
          } >> $env:GITHUB_STEP_SUMMARY
        shell: pwsh
